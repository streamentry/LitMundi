name: One-time npm lockfile bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  create-lockfile:
    if: github.repository == 'streamentry/LitMundi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Resolve and lock dependencies
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile only if absent
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: pin npm dependency graph"
          git push origin HEAD:main
